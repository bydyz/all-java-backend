# ====== Spring Boot 配置文件 ======
# 配置项使用小写字母，单词用 - 分隔

server:
  port: 8080                          # 服务端口，默认 8080
  servlet:
    context-path: /api                # 上下文路径，所有请求需要加 /api 前缀

spring:
  application:
    name: spring-boot-starter-demo    # 应用名称
  
  # ====== MySQL 数据源配置 ======
  datasource:
    url: jdbc:mysql://localhost:3306/my_test_database?useSSL=false&serverTimezone=Asia/Shanghai
    # url: jdbc:mysql://localhost:3306/my_test_database?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4  用 utf8mb4 会启动不起来
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root                    # MySQL 用户名，根据实际情况修改
    password: rU^c*sM_SL1.ye                  # MySQL 密码，根据实际情况修改
  
  # ====== JPA 配置 ======
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update                # 自动更新表结构（保留数据）
    show-sql: true                    # 显示 SQL 语句
    properties:
      hibernate:
        format_sql: true              # 格式化 SQL 输出

# ====== 日志配置 ======
logging:
  level:
    org.example: DEBUG                # 设置应用包的日志级别
    org.springframework: INFO         # Spring 框架日志级别
