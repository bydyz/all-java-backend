# 应用配置
server:
  port: 8080

# Spring 配置
spring:
  # 数据源配置
  datasource:
    # 使用 H2 内存数据库（学习用，无需外部数据库）
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    
  # H2 控制台配置（用于查看数据库）
  h2:
    console:
      enabled: true
      path: /h2-console
      
  # SQL 初始化配置
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# MyBatis-Plus 配置
mybatis-plus:
  # 日志配置（开发环境使用）
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    
  # 全局配置
  global-config:
    db-config:
      # 主键策略：自增
      id-type: auto
      # 表名前缀
      table-prefix: sys_
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0